services:
  app:
    build: .
    command: >
      sh -c "uv run alembic upgrade head && 
             uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - "**/.*"
            - .venv/
            - __pycache__/
        
        - action: sync+restart
          path: ./alembic/versions/
          target: /app/alembic/versions/
          ignore:
            - __pycache__/
        

        - action: rebuild
          path: pyproject.toml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/10-seed.sql 
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD-SHELL", "redis_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: